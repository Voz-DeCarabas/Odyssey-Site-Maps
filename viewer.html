<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Settlement Viewer</title>

    <link rel="stylesheet"
          href="css/viewer.css">

</head>
<body>

<div id="viewer">

    <img id="mapImage">

    <h1 id="layoutHeading">Settlement Viewer</h1>

    <div id="overlay"></div>

    <div id="markerKey" class="markerKey">
        <div class="markerKeyItem">
            <span class="markerKeySymbol z0"></span>
            <span>Ground Floor</span>
        </div>
        <div class="markerKeyItem">
            <span class="markerKeySymbol z1"></span>
            <span>First Floor</span>
        </div>
        <div class="markerKeyItem">
            <span class="markerKeySymbol z2"></span>
            <span>Second Floor</span>
        </div>
    </div>

    <div id="toolbar"></div>

</div>

<script type="module"
        src="js/viewer.js"></script>

</body>
</html>
